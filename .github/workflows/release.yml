name: Release executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0-alpha.2)
        required: true
        type: string
      publish:
        description: Publish an existing tag; false builds the selected workflow commit for review only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tagged source and embedded UI
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.publish && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Validate tag, version and source commit
        id: metadata
        run: |
          if [ "$BUILD_ONLY" = 'true' ]; then
            python3 tools/release.py metadata --tag "$RELEASE_TAG" --allow-untagged
          else
            python3 tools/release.py metadata --tag "$RELEASE_TAG"
          fi
      - name: Rebuild and validate embedded UI
        run: |
          npm ci --prefix webui
          npm test --prefix webui
          npm run build --prefix webui
          git diff --exit-code -- internal/host/web/dist
          python3 tools/check_baseline.py
          python3 tools/test-release.py

  build:
    name: ${{ matrix.label }}
    needs: prepare
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            os: darwin
            arch: arm64
          - label: macOS Intel
            runner: macos-15-intel
            os: darwin
            arch: amd64
          - label: Linux x64
            runner: ubuntu-22.04
            os: linux
            arch: amd64
          - label: Linux ARM64
            runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_OS: ${{ matrix.os }}
      RELEASE_ARCH: ${{ matrix.arch }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libsqlite3-dev pkg-config patchelf iproute2
      - name: Prepare pinned Go dependencies
        run: go mod download
      - name: Build and bundle native executable dependencies
        run: python3 tools/release.py build --tag "$RELEASE_TAG" --os "$RELEASE_OS" --arch "$RELEASE_ARCH"
      - name: Verify extracted macOS package
        if: runner.os == 'macOS'
        run: python3 tools/release.py verify --tag "$RELEASE_TAG" --archive ".bin/release/wispcat_${RELEASE_TAG}_${RELEASE_OS}_${RELEASE_ARCH}.tar.gz"
      - name: Verify extracted Linux package without external network
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net -- sh -c '
            ip link set lo up
            exec runuser -u "$1" -- env PATH="$2" python3 tools/release.py verify --tag "$3" --archive "$4"
          ' sh "$(id -un)" "$PATH" "$RELEASE_TAG" ".bin/release/wispcat_${RELEASE_TAG}_${RELEASE_OS}_${RELEASE_ARCH}.tar.gz"
      - name: Upload verified archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: .bin/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'push' || inputs.publish
    name: Publish complete release with SHA256SUMS
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download all verified target archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: .bin/release-all
          merge-multiple: true
      - name: Validate commit and CI, upload draft assets, then publish
        run: python3 tools/release.py publish --tag "$RELEASE_TAG" --directory .bin/release-all
