<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">WispCat 系统架构</title>
<desc id="architecture-desc">微信账号与凭证经过 WispCat 独立协议运行时，再通过 OneBot v11 对接 AstrBot、NoneBot、Go SDK 与 MCP。运行时提供管理页面及账号隔离的加密存储，模型与工具权限由外部消费者负责。</desc>
